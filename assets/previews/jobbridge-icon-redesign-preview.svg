<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-label="진로브릿지 아이콘 재디자인 시안">
  <defs>
    <style>
      .page { fill: #f4f7fb; }
      .panel { fill: #fff; stroke: #dbe8f8; stroke-width: 1.2; }
      .tile { fill: #f8fbff; stroke: #e4eefb; stroke-width: 1.2; }
      .title { fill: #101d34; font: 900 30px Pretendard, Arial, sans-serif; }
      .sub { fill: #66758f; font: 700 15px Pretendard, Arial, sans-serif; }
      .label { fill: #17233c; font: 900 16px Pretendard, Arial, sans-serif; }
      .note { fill: #66758f; font: 700 12px Pretendard, Arial, sans-serif; }
      .stroke { fill: none; stroke: #244064; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: none; stroke: #1267f1; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .teal { fill: none; stroke: #13aaa5; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .violet { fill: none; stroke: #7d5cf6; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .fill-blue { fill: #1267f1; }
      .fill-teal { fill: #13aaa5; }
      .shadow { filter: drop-shadow(0 12px 24px rgba(31, 69, 128, .07)); }
    </style>
  </defs>

  <rect class="page" width="1280" height="820"/>
  <text x="56" y="64" class="title">아이콘 재디자인 시안</text>
  <text x="56" y="94" class="sub">기존 화면 디자인은 유지하고, 아이콘만 더 정교한 라인형으로 통일하는 방향</text>

  <rect x="56" y="126" width="1168" height="292" rx="26" class="panel shadow"/>
  <text x="88" y="172" class="label">사이드 메뉴 아이콘</text>
  <text x="88" y="196" class="note">남색 기본선 + 파랑·청록·보라 포인트, 장식 배경선 없음</text>

  <g transform="translate(92 232)">
    <rect width="104" height="104" rx="24" class="tile"/>
    <path class="stroke" d="M26 82V54l26-22 26 22v28z"/>
    <path class="accent" d="M44 82V64h16v18"/>
    <text x="52" y="140" text-anchor="middle" class="label">홈</text>
  </g>

  <g transform="translate(228 232)">
    <rect width="104" height="104" rx="24" class="tile"/>
    <circle class="stroke" cx="52" cy="42" r="12"/>
    <path class="stroke" d="M30 80c4-20 40-20 44 0"/>
    <path class="accent" d="M38 82h28"/>
    <text x="52" y="140" text-anchor="middle" class="label">학생 정보</text>
  </g>

  <g transform="translate(364 232)">
    <rect width="104" height="104" rx="24" class="tile"/>
    <path class="stroke" d="M33 26h31l9 9v43H33z"/>
    <path class="stroke" d="M64 26v11h11"/>
    <path class="accent" d="M43 48h18M43 60h24M43 72h14"/>
    <text x="52" y="140" text-anchor="middle" class="label">활동 기록</text>
  </g>

  <g transform="translate(500 232)">
    <rect width="104" height="104" rx="24" class="tile"/>
    <circle class="stroke" cx="47" cy="48" r="20"/>
    <path class="accent" d="M61 62l17 17"/>
    <path class="teal" d="M39 48h16M47 40v16"/>
    <text x="52" y="140" text-anchor="middle" class="label">진로 탐색</text>
  </g>

  <g transform="translate(636 232)">
    <rect width="104" height="104" rx="24" class="tile"/>
    <circle class="stroke" cx="33" cy="52" r="9"/>
    <circle class="stroke" cx="72" cy="34" r="9"/>
    <circle class="stroke" cx="72" cy="72" r="9"/>
    <path class="accent" d="M41 48l23-11M41 57l23 11"/>
    <text x="52" y="140" text-anchor="middle" class="label">진로 연결</text>
  </g>

  <g transform="translate(772 232)">
    <rect width="104" height="104" rx="24" class="tile"/>
    <path class="stroke" d="M26 40h52v36H26z"/>
    <path class="teal" d="M40 40v-6a12 12 0 0 1 24 0v6"/>
    <path class="accent" d="M36 54h30M36 64h20"/>
    <text x="52" y="140" text-anchor="middle" class="label">포트폴리오</text>
  </g>

  <g transform="translate(908 232)">
    <rect width="104" height="104" rx="24" class="tile"/>
    <path class="stroke" d="M27 78V41l25-15 25 15v37"/>
    <path class="accent" d="M42 78V55h20v23"/>
    <path class="teal" d="M40 43h24"/>
    <circle class="fill-blue" cx="52" cy="20" r="3.5"/>
    <text x="52" y="140" text-anchor="middle" class="label">ZEP</text>
  </g>

  <g transform="translate(1044 232)">
    <rect width="104" height="104" rx="24" class="tile"/>
    <path class="stroke" d="M29 35h46v30H44L31 76V65h-2z"/>
    <path class="accent" d="M41 47h22M41 57h14"/>
    <text x="52" y="140" text-anchor="middle" class="label">문의</text>
  </g>

  <rect x="56" y="462" width="1168" height="286" rx="26" class="panel shadow"/>
  <text x="88" y="508" class="label">홈 버튼용 아이콘</text>
  <text x="88" y="532" class="note">시작하기와 ZEP도 파란 배경을 만들지 않고 아이콘 내부 포인트만 사용</text>

  <g transform="translate(120 570)">
    <rect width="290" height="112" rx="22" fill="#fff" stroke="#dbe8f8"/>
    <rect x="26" y="28" width="56" height="56" rx="16" class="tile"/>
    <circle cx="54" cy="56" r="21" fill="#eaf3ff"/>
    <path class="stroke" d="M43 56h22"/>
    <path class="accent" d="M54 45v22"/>
    <path class="teal" d="M38 80c12 10 32 10 44 0"/>
    <text x="104" y="53" class="label">시작하기</text>
    <text x="104" y="77" class="note">활동 시작을 플러스와 진행선으로 표현</text>
  </g>

  <g transform="translate(470 570)">
    <rect width="290" height="112" rx="22" fill="#fff" stroke="#dbe8f8"/>
    <rect x="26" y="28" width="56" height="56" rx="16" class="tile"/>
    <path class="stroke" d="M38 50h32v24H38z"/>
    <path class="teal" d="M47 50v-5a7 7 0 0 1 14 0v5"/>
    <path class="accent" d="M45 60h18M45 67h12"/>
    <text x="104" y="53" class="label">내 포트폴리오</text>
    <text x="104" y="77" class="note">문서/전시대 느낌을 약하게 표현</text>
  </g>

  <g transform="translate(820 570)">
    <rect width="290" height="112" rx="22" fill="#fff" stroke="#dbe8f8"/>
    <rect x="26" y="28" width="56" height="56" rx="16" class="tile"/>
    <path class="stroke" d="M35 78V42l19-12 19 12v36"/>
    <path class="accent" d="M45 78V56h18v22"/>
    <path class="violet" d="M40 46h28"/>
    <circle class="fill-teal" cx="54" cy="24" r="3.5"/>
    <text x="104" y="53" class="label">ZEP 전시관</text>
    <text x="104" y="77" class="note">공간/입장문 의미를 유지</text>
  </g>
</svg>
